name: Discover official team logos

on:
  push:
    branches:
      - work/v2-expansion-assets-leagues
    paths:
      - scripts/discover-official-team-logos.mjs
      - scripts/discover-official-team-logos.test.mjs
      - .github/workflows/discover-team-logos.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        league: [laliga, premierleague, ligue1, bundesliga]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate parser
        run: node --test scripts/discover-official-team-logos.test.mjs
      - name: Discover official team logos
        id: discover
        shell: bash
        run: |
          set +e
          node scripts/discover-official-team-logos.mjs --league "${{ matrix.league }}" > "team-logos-${{ matrix.league }}.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -s "team-logos-${{ matrix.league }}.json"
      - name: Upload discovery audit
        uses: actions/upload-artifact@v4
        with:
          name: team-logos-${{ matrix.league }}
          path: team-logos-${{ matrix.league }}.json
          if-no-files-found: error
