name: Split V2 seed

on:
  push:
    branches:
      - refonte/watchtvsport-v2
    paths:
      - '.github/workflows/split-v2-seed.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refonte/watchtvsport-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run export:v2-seed
      - name: Split seed into import chunks
        run: |
          node --input-type=module <<'NODE'
          import { readFile, mkdir, writeFile } from 'node:fs/promises';
          const bundle = JSON.parse(await readFile('data/imports/seed-2026-ucl-f1.json', 'utf8'));
          await mkdir('data/imports/chunks', { recursive: true });
          const size = 50;
          for (let i = 0; i < bundle.records.length; i += size) {
            const n = String(i / size + 1).padStart(2, '0');
            await writeFile(`data/imports/chunks/chunk-${n}.json`, JSON.stringify(bundle.records.slice(i, i + size)) + '\n');
          }
          NODE
      - name: Commit seed chunks
        run: |
          git config user.name "watchtvsport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/imports/chunks
          if git diff --cached --quiet; then
            echo "Chunks already current"
          else
            git commit -m "Generate V2 seed import chunks"
            git push origin HEAD:refonte/watchtvsport-v2
          fi
