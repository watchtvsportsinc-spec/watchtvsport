name: Discover Premier League fixtures

on:
  push:
    branches:
      - work/v2-expansion-assets-leagues
    paths:
      - scripts/discover-premier-league-fixtures.mjs
      - scripts/discover-premier-league-fixtures.test.mjs
      - .github/workflows/discover-premier-league-fixtures.yml
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate parser
        run: node --test scripts/discover-premier-league-fixtures.test.mjs
      - name: Discover official Premier League fixtures
        shell: bash
        run: |
          set +e
          node scripts/discover-premier-league-fixtures.mjs > premier-league-2026-27-fixtures.json
          code=$?
          echo "Discovery exit code: $code"
          test -s premier-league-2026-27-fixtures.json
          exit $code
      - name: Upload fixture audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premier-league-2026-27-fixtures
          path: premier-league-2026-27-fixtures.json
          if-no-files-found: warn
