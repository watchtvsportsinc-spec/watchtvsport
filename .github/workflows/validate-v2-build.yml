name: Validate V2 build

on:
  push:
    branches:
      - refonte/watchtvsport-v2
      - seo/**
      - audit/universal-club-media
      - ux/friendly-navigation-cards
      - feature/entity-navigation-v2
      - feature/entity-media-policy-v2
      - feature/football-club-identities-v2
      - feature/automatic-participant-pages-v2
      - feature/automatic-competition-event-pages-v2
      - fix/permanent-competition-pages
      - ux/home-premium-schedule
      - ux/home-premium-visual-pass
      - fix/club-profile-supabase-fallback
      - feature/participant-sport-visuals
    paths:
      - '.github/workflows/validate-v2-build.yml'
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'source/**'
      - 'scripts/**'
      - 'supabase*.sql'
      - 'supabase/functions/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
