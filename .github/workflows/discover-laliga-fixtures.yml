name: Discover LaLiga fixtures

on:
  push:
    branches:
      - work/v2-expansion-assets-leagues
    paths:
      - scripts/discover-laliga-fixtures.mjs
      - scripts/discover-laliga-fixtures.test.mjs
      - .github/workflows/discover-laliga-fixtures.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate parser
        run: node --test scripts/discover-laliga-fixtures.test.mjs
      - name: Discover official LaLiga fixtures
        shell: bash
        run: |
          set +e
          node scripts/discover-laliga-fixtures.mjs > laliga-2026-27-fixtures.json
          code=$?
          test -s laliga-2026-27-fixtures.json
          exit $code
      - name: Upload fixture audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laliga-2026-27-fixtures
          path: laliga-2026-27-fixtures.json
          if-no-files-found: warn
