name: Generate V2 seed

on:
  push:
    branches:
      - refonte/watchtvsport-v2
    paths:
      - '.github/workflows/generate-v2-seed.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refonte/watchtvsport-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:seed
      - run: npm run export:v2-seed
      - name: Commit generated seed
        run: |
          git config user.name "watchtvsport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/imports/seed-2026-ucl-f1.json
          if git diff --cached --quiet; then
            echo "Seed already current"
          else
            git commit -m "Generate V2 UCL and F1 seed"
            git push origin HEAD:refonte/watchtvsport-v2
          fi
